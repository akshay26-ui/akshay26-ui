name: Generate README Stats & Snake

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # allows manual trigger from Actions tab

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Contribution Snake
  # Generates snake.svg → pushes to branch: snake-output
  # ─────────────────────────────────────────────────────────────
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push snake to snake-output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — GitHub Stats SVG
  # Generates stats.svg → pushes to branch: stats-output
  # ─────────────────────────────────────────────────────────────
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch GitHub Stats
        uses: teoxoy/profile-readme-stats@v2
        with:
          username: akshay26-ui
          output-dir: stats-dist
          count-private: true
          include-all-commits: true
          theme: chartreuse-dark
          hide-border: true

      - name: Push stats SVG to stats-output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: stats-output
          build_dir: stats-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — Top Languages SVG
  # Generates languages.svg → pushes to branch: languages-output
  # ─────────────────────────────────────────────────────────────
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch Top Languages
        uses: teoxoy/profile-readme-stats@v2
        with:
          username: akshay26-ui
          output-dir: lang-dist
          type: top-langs
          count-private: true
          include-all-commits: true
          layout: compact
          theme: chartreuse-dark
          hide-border: true

      - name: Push languages SVG to languages-output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: languages-output
          build_dir: lang-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
