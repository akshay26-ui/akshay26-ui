name: Generate README Stats & Snake

on:
  schedule:
    # Runs every day at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch: # Enables the "Run workflow" button in Actions tab

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Snake animation → snake-output branch
  # ─────────────────────────────────────────────────────────────
  snake:
    name: Snake Animation
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg

      - name: Push to snake-output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: snake-output
          publish_dir: dist
          force_orphan: true

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — GitHub Stats SVG → stats-output branch
  # Fetches directly from shion.dev API using curl (no broken actions)
  # ─────────────────────────────────────────────────────────────
  stats:
    name: Stats SVG
    runs-on: ubuntu-latest
    steps:
      - name: Fetch stats SVG
        run: |
          mkdir -p dist
          curl -L -o dist/stats.svg \
            "https://github-readme-stats.shion.dev/api?username=akshay26-ui&theme=chartreuse-dark&hide_border=true&include_all_commits=true&count_private=true&show_icons=true"

      - name: Push to stats-output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: stats-output
          publish_dir: dist
          force_orphan: true

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — Top Languages SVG → languages-output branch
  # ─────────────────────────────────────────────────────────────
  languages:
    name: Languages SVG
    runs-on: ubuntu-latest
    steps:
      - name: Fetch languages SVG
        run: |
          mkdir -p dist
          curl -L -o dist/languages.svg \
            "https://github-readme-stats.shion.dev/api/top-langs/?username=akshay26-ui&theme=chartreuse-dark&hide_border=true&include_all_commits=true&count_private=true&layout=compact"

      - name: Push to languages-output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: languages-output
          publish_dir: dist
          force_orphan: true
